# Render Blueprint for the FairShare API (free demo hosting).
# Render → New → Blueprint → pick this repo. It creates the service below and asks for the
# values marked `sync: false`. Full walkthrough: DEPLOYMENT.md.
services:
  - type: web
    name: fairshare-api
    runtime: docker
    plan: free
    # Keep the API in the same region as the Neon database. Singapore is closest to Sri Lanka.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Neon's *direct* (not "-pooler") connection string. A postgresql:// URL is fine.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Random 256-bit secret generated by Render once, then kept across deploys.
      - key: Jwt__Key
        generateValue: true
      # The web app's URL, e.g. https://fairshare.pages.dev (comma-separate several).
      - key: AllowedOrigins
        sync: false
